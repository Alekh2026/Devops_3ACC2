# Serves the Angular build and forwards /api calls to the backend Service.
# Same origin for the browser = no CORS headaches in production.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DNS server taken from the pod resolv.conf at startup (NGINX_LOCAL_RESOLVERS),
    # backend name looked up per request so Nginx starts even before the API exists
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
    set $backend_upstream http://backend.gestion-projets.svc.cluster.local:8080;

    # /api/projet/all  ->  http://backend:8080/projet/all
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Cache hashed assets for a long time, never cache index.html
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Angular router: unknown paths fall back to index.html
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    # Lightweight probe endpoint for Kubernetes
    location = /healthz {
        access_log off;
        return 200 "ok";
    }
}
