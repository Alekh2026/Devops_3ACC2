# Headlamp - web console for the cluster (namespaces, workloads, pods, services, logs...)
# Exposed on NodePort 30466, published on the VM as port 4466 (ops/dashboard-tunnel.service).
# Login token:  kubectl -n headlamp get secret headlamp-viewer-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: v1
kind: Namespace
metadata:
  name: headlamp
---
# Read-only account used to sign in to the console
apiVersion: v1
kind: ServiceAccount
metadata:
  name: headlamp-viewer
  namespace: headlamp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-read-only
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["get", "list", "watch"]
  - nonResourceURLs: ["*"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: headlamp-viewer
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-read-only
subjects:
  - kind: ServiceAccount
    name: headlamp-viewer
    namespace: headlamp
---
# Long-lived token for the viewer account
apiVersion: v1
kind: Secret
metadata:
  name: headlamp-viewer-token
  namespace: headlamp
  annotations:
    kubernetes.io/service-account.name: headlamp-viewer
type: kubernetes.io/service-account-token
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: headlamp
  namespace: headlamp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: headlamp
  template:
    metadata:
      labels:
        app: headlamp
    spec:
      containers:
        - name: headlamp
          image: ghcr.io/headlamp-k8s/headlamp:v0.26.0
          args: ["-in-cluster", "-plugins-dir=/headlamp/plugins"]
          ports:
            - containerPort: 4466
          resources:
            requests: { cpu: 20m, memory: 48Mi }
            limits:   { memory: 160Mi }
          readinessProbe:
            httpGet: { path: /, port: 4466 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: headlamp
  namespace: headlamp
spec:
  type: NodePort
  selector:
    app: headlamp
  ports:
    - port: 80
      targetPort: 4466
      nodePort: 30466
