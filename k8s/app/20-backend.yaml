# Spring Boot API. The image tag is replaced by Jenkins with the build number.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: gestion-projets
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: hyperrftw/devops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DB_URL
              value: jdbc:mysql://mysql:3306/devops_db?createDatabaseIfNotExist=true
            - name: DB_USERNAME
              value: root
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: password
            - name: CORS_ALLOWED_ORIGINS
              value: http://192.168.56.10:4200,http://localhost:4200
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          resources:
            requests: { cpu: 200m, memory: 384Mi }
            limits:   { memory: 640Mi }
          # Spring Boot Actuator probes
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 36      # up to 3 min for the first start
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: gestion-projets
spec:
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080
